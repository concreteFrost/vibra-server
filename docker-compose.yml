services:
 
  db:
    image: postgres:18-alpine
    container_name: vibra_db
    
    env_file:
      - .env

    environment:
      - PGDATA=/var/lib/postgresql/data

    volumes:
      - db-data:/var/lib/postgresql/data

    restart: always

    ports:
      - "5435:5432"

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    
  
  server:
    build: .
    container_name: vibra_server
    env_file:
      - .env

    ports:
      - "8083:8081"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:

